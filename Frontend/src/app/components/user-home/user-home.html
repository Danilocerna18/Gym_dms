<div class="app-layout">
  <!-- Sidebar Móvil (Header superior) -->
  <header class="mobile-header">
    <div class="flex items-center gap-2">
      <span class="material-symbols-outlined text-iron-950 text-2xl">fitness_center</span>
      <span class="font-bold text-iron-950 text-xl tracking-tighter">GymSync</span>
    </div>
  </header>

  <!-- Sidebar Escritorio (Fija a la izquierda como en la foto) -->
  <aside class="desktop-sidebar">
    <div class="sidebar-top">
      <div class="brand-logo">
        <span class="material-symbols-outlined text-iron-950 text-3xl">fitness_center</span>
        <span class="font-bold text-iron-950 text-2xl tracking-tighter">GymSync</span>
      </div>

      <nav class="sidebar-nav">
        <a routerLink="/user-home" class="nav-item active">
          <span class="material-symbols-outlined">dashboard</span>
          <span>Inicio</span>
        </a>
        <a routerLink="/user-escaner" class="nav-item">
          <span class="material-symbols-outlined">qr_code_scanner</span>
          <span>Escanear Máquina</span>
        </a>
        <a routerLink="/user-perfil" class="nav-item">
          <span class="material-symbols-outlined">person</span>
          <span>Perfil</span>
        </a>
      </nav>
    </div>

    <!-- Perfil de usuario abajo a la izquierda -->
    <a routerLink="/user-perfil" class="user-card-bottom">
      <div class="avatar-circle">
        <span>SB</span>
      </div>
    </div>

    <!-- Acciones -->
    <div class="flex flex-col gap-4 w-full">
      <button routerLink="/user-escaner" class="w-full bg-signal-red hover:bg-signal-red-hover text-white font-headline-md text-[18px] uppercase tracking-wider py-4 px-6 rounded-custom flex items-center justify-center gap-3 transition-all active:scale-[0.98] shadow-md min-h-touch-target-min">
        <span class="material-symbols-outlined text-[24px]">qr_code_scanner</span>
        <span>Escanear QR de Máquina</span>
      </button>
    </div>
  </main>

  <!-- Navegación Móvil Inferior -->
  <nav class="mobile-nav">
    <a routerLink="/user-home" class="mobile-nav-item active">
      <span class="material-symbols-outlined">dashboard</span>
      <span>Inicio</span>
    </a>
    <a routerLink="/user-escaner" class="mobile-nav-item">
      <span class="material-symbols-outlined">qr_code_scanner</span>
      <span>Escanear</span>
    </a>
    <a routerLink="/user-perfil" class="mobile-nav-item">
      <span class="material-symbols-outlined">person</span>
      <span>Perfil</span>
    </a>
  </nav>
</div>
