<div class="app-layout">
  <!-- Header Móvil -->
  <header class="mobile-header">
    <div class="flex items-center gap-2">
      <span class="material-symbols-outlined text-signal-red text-2xl">fitness_center</span>
      <span class="font-headline-md text-headline-md font-extrabold text-chalk-50 tracking-tighter uppercase">GymSync</span>
    </div>
  </header>

  <!-- Sidebar Escritorio -->
  <aside class="desktop-sidebar">
    <div class="sidebar-top">
      <div class="brand-logo">
        <span class="material-symbols-outlined text-signal-red text-3xl">fitness_center</span>
        <span class="font-headline-md text-headline-md font-extrabold text-chalk-50 tracking-tighter uppercase">GymSync</span>
      </div>

      <nav class="sidebar-nav">
        <a routerLink="/user-home" class="nav-item">
          <span class="material-symbols-outlined">dashboard</span>
          <span>Inicio</span>
        </a>
        <a routerLink="/user-escaner" class="nav-item active" aria-current="page">
          <span class="material-symbols-outlined">qr_code_scanner</span>
          <span>Escanear</span>
        </a>
        <a routerLink="/user-perfil" class="nav-item">
          <span class="material-symbols-outlined">person</span>
          <span>Perfil</span>
        </a>
      </nav>
    </div>

    <a routerLink="/user-perfil" class="user-card-bottom">
      <div class="avatar-circle">
        <span>SB</span>
      </div>
      <div class="user-info">
        <span class="user-name">Sofia Bilbao</span>
      </div>
    </a>
  </aside>

  <!-- Contenido Principal: Escáner QR -->
  <main class="main-content">
    <div class="content-container flex-center">
      
      <div class="scanner-card">
        <div class="scanner-header">
          <button class="btn-close" (click)="closeScanner()" aria-label="Cerrar escáner">
            <span class="material-symbols-outlined">close</span>
          </button>
          <h2>Apunta al Código QR</h2>
          <p>Escanea el código de la máquina para abrir su guía de entrenamiento</p>
        </div>

        <!-- Marco del Visor QR -->
        <div class="qr-frame-wrapper" (click)="onScanSuccess()">
          <div class="qr-viewfinder">
            <span class="material-symbols-outlined qr-icon-center">qr_code_2</span>
            <div class="scan-corner corner-tl"></div>
            <div class="scan-corner corner-tr"></div>
            <div class="scan-corner corner-bl"></div>
            <div class="scan-corner corner-br"></div>
            <div class="scan-laser"></div>
          </div>
        </div>

        <p class="scan-status-text">ESCANEANDO MÁQUINA...</p>

        <button class="btn-upload-gallery" (click)="onScanSuccess()">
          <span class="material-symbols-outlined">upload_file</span>
          <span>SUBIR DESDE GALERÍA</span>
        </button>
      </div>

    </div>
  </main>

  <!-- Navegación Móvil Inferior -->
  <nav class="mobile-nav">
    <a routerLink="/user-home" class="mobile-nav-item">
      <span class="material-symbols-outlined">dashboard</span>
      <span>Inicio</span>
    </a>
    <a routerLink="/user-escaner" class="mobile-nav-item active" aria-current="page">
      <span class="material-symbols-outlined">qr_code_scanner</span>
      <span>Escanear</span>
    </a>
    <a routerLink="/user-perfil" class="mobile-nav-item">
      <span class="material-symbols-outlined">person</span>
      <span>Perfil</span>
    </a>
  </nav>
</div>
